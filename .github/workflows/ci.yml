name: CI/CD DevSecOps Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main", "cv-back" ]
  # Permite lanzar el workflow de forma manual desde la interfaz de GitHub (Ideal para Ragas)
  workflow_dispatch: 

jobs:
  # -------------------------------------------------------------------------
  # 1. PRUEBAS DEL FRONTEND
  # -------------------------------------------------------------------------
  frontend-tests:
    name: Frontend Tests (Vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./cv-generator-frontend/tavi-cv-gen

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './cv-generator-frontend/tavi-cv-gen/package-lock.json'

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar linter
        run: npm run lint --if-present

      - name: Ejecutar pruebas unitarias
        run: npm run test:unit || npx vitest run

  # -------------------------------------------------------------------------
  # 2. PRUEBAS DEL BACKEND
  # -------------------------------------------------------------------------
  backend-tests:
    name: Backend Tests (Pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./cv-generator-backend
    
    # Levantamos un MongoDB temporal solo para el entorno de pruebas
    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio httpx

      - name: Ejecutar pruebas unitarias
        env:
          # Inyectamos variables de entorno que tu backend y pruebas puedan requerir
          MONGO_URI: mongodb://localhost:27017/test_cv_database
          JWT_SECRET: supersecret_test_key
          GOOGLE_API_KEY: "mock_key_for_unit_tests"
          GEMINI_API_KEY: "mock_key_for_unit_tests"
          PYTHONPATH: .
        run: |
          pytest tests/ -v
          
  # -------------------------------------------------------------------------
  # 3. EVALUACIÓN DE RAGAS (IA)
  # -------------------------------------------------------------------------
  ragas-evaluation:
    name: Ragas & LLM Evaluation
    runs-on: ubuntu-latest
    # Solo ejecuta este job si los tests del backend pasaron exitosamente
    needs: backend-tests 
    # Para ahorrar costos, solo lo ejecutamos en la rama main o si se lanza manualmente
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    defaults:
      run:
        working-directory: ./cv-generator-backend

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ejecutar script de evaluación Ragas
        env:
          # Se necesita agregar este secreto en la configuración de GitHub Repository Secrets
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          PYTHONPATH: .
        run: |
          python test_scripts/run_ragas_real_evaluation.py